# The one definition of "this commit is good": build, Mozilla lint, all three test
# suites, and both store packages. Runs on every push and PR, and is called by
# release.yml so a release can never test a different thing than a commit does.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The DOM and e2e suites drive a real browser; Playwright's bundled Chromium
      # is what `channel: "chromium"` resolves to.
      - run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Mozilla add-on lint (AMO's own validator)
        run: npm run lint:firefox

      - name: Unit tests
        run: npm run test:unit

      - name: DOM tests
        run: npm run test:dom

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Package for both stores
        run: npm run package

      # AMO wants readable source whenever a submission contains bundled or
      # generated code. Ours is bundled by esbuild, so it travels with the release.
      - name: Source archive for AMO reviewers
        run: git archive --format=zip -o dist/artifacts/deslopify-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: store-packages
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 30
