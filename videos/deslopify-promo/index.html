<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0B0E13;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="34.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="4"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-feed"
        class="scene"
        data-composition-id="03-feed"
        data-composition-src="compositions/frames/03-feed.html"
        data-start="8.5"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-explain"
        class="scene"
        data-composition-id="04-explain"
        data-composition-src="compositions/frames/04-explain.html"
        data-start="14.5"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-tune"
        class="scene"
        data-composition-id="05-tune"
        data-composition-src="compositions/frames/05-tune.html"
        data-start="20"
        data-duration="6.1"
        data-track-index="0"
      ></div>

      <div
        id="el-06-privacy"
        class="scene"
        data-composition-id="06-privacy"
        data-composition-src="compositions/frames/06-privacy.html"
        data-start="25.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="29.5"
        data-duration="5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4);
        tl.fromTo("#el-02-intro", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4);
        tl.to("#el-02-intro", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 8.5);
        tl.fromTo("#el-03-feed", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 8.5);
        tl.to("#el-03-feed", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 14.5);
        tl.fromTo("#el-04-explain", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 14.5);
        tl.to("#el-04-explain", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 20);
        tl.fromTo("#el-05-tune", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 20);
        tl.to("#el-05-tune", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 25.5);
        tl.fromTo("#el-06-privacy", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 25.5);
        tl.to("#el-06-privacy", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 29.5);
        tl.fromTo("#el-07-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 29.5);
        tl.to({}, { duration: 34.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
