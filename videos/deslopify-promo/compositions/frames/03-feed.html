    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["03-feed"] = tl;

        const $ = (s) => document.getElementById("f03-feed-" + s);
        const camera = $("camera"), win = $("window"), world = $("world"), h2 = $("h2");
        const pills = [1, 2, 3].map((n) => $("pill-" + n));

        // Scene 1 (0.0–1.4): window rises from below-centre and settles; h2 fades in; steady push begins
        tl.fromTo(win, { y: 220, opacity: 0 }, { y: 0, opacity: 1, duration: 1.2, ease: "power3.out" }, 0);
        tl.fromTo(h2, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.5);

        // multi-phase-camera, steady-push mode: 1.00 → 1.04 over Scenes 1–2, at rest for the Scene 3 hold.
        // Drift omitted on purpose — the packet asks for "no breathing" on the hold.
        const cam = { scale: 1 };
        tl.to(cam, {
          scale: 1.04, duration: 4.6, ease: "sine.out",
          onUpdate: () => { camera.style.transform = `scale(${cam.scale})`; },
        }, 0);

        // Scene 2 (1.4–4.6): three eased scroll steps (viewport-change on .world), a pill mask-wipes in on each pause.
        // Stops (image scaled 1.7×): -24 = nugget post to the top edge; -420 = useful post centred; -740 = scroll end, slop post low.
        const steps = [
          { at: 1.4, y: -24,  pill: 0 },
          { at: 2.5, y: -420, pill: 1 },
          { at: 3.7, y: -740, pill: 2 },
        ];
        steps.forEach(({ at, y, pill }) => {
          tl.to(world, { y, duration: 0.55, ease: "power3.inOut" }, at);
          tl.fromTo(pills[pill],
            { clipPath: "inset(0px 100% 0px 0px round 100px)" },
            { clipPath: "inset(0px 0% 0px 0px round 100px)", duration: 0.5, ease: "power3.out" },
            at + 0.5);
        });

        // Scene 3 (4.6–6.0): hold — scroll rests on the slop post, push stopped, no motion.
        tl.set({}, {}, 6); // pin duration
      })();
    </script>
