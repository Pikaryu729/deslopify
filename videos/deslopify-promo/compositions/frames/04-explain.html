<template>
  <div id="root" data-composition-id="04-explain" data-duration="6" data-width="1920" data-height="1080">
    <style>
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        container-type: size;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #F2F4F7;
      }
      .clip { position: absolute; inset: 0; }
      [id="f04-explain-bg"] { background: #0B0E13; }

      /* 60/40: the held window fills ~62% width on the left (80..1270), copy column 1330..1840 */
      [id="f04-explain-window"] {
        position: absolute; left: 80px; top: 118px; width: 1190px; height: 744px;
        background: rgba(240, 180, 41, 0.04);
        border: 1.5px solid rgba(240, 180, 41, 0.2);
        border-radius: 14px;
        overflow: hidden;            /* zoomed raster is clipped at the card */
        will-change: transform, opacity;
      }
      /* coordinate-target-zoom: outer scales, inner counter-translates */
      [id="f04-explain-zoom-outer"] {
        position: absolute; inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      [id="f04-explain-zoom-inner"] {
        position: absolute; inset: 0;
        will-change: transform;
      }
      [id="f04-explain-shot"] {
        display: block; width: 1190px; height: 744px; /* 1280×800 @ 0.9297 */
        border-radius: 12px;
      }

      [id="f04-explain-h2"] {
        position: absolute; left: 1330px; top: 128px; width: 510px;
        font-size: 2.6cqw; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em;
        color: #F2F4F7; white-space: nowrap;
      }

      /* center-outward-expansion: chips share one centre (1585, 520) and spread vertically */
      [id="f04-explain-burst"] {
        position: absolute; left: 1330px; top: 300px; width: 510px; height: 440px;
      }
      .chip {
        position: absolute; top: 50%; left: 50%;
        width: 470px; box-sizing: border-box;
        padding: 18px 22px 20px 24px;
        background: rgba(240, 180, 41, 0.04);
        border: 1.5px solid rgba(240, 180, 41, 0.2);
        border-left: 4px solid #F0B429;   /* leading border = primary */
        border-radius: 12px;
        will-change: transform, opacity;
      }
      .chip-title {
        font-size: 1.35cqw; font-weight: 600; line-height: 1.3; letter-spacing: -0.02em;
        color: #F2F4F7; margin-bottom: 12px;
      }

      /* stat-bars-and-fills: three tiny tracks; fills scaleX from the left */
      .bars { display: grid; gap: 7px; width: 300px; }
      .track { height: 6px; border-radius: 6px; background: rgba(240, 180, 41, 0.08); overflow: hidden; }
      .fill { display: block; width: 100%; height: 100%; border-radius: 6px; transform-origin: left center; }
      .fill-gold { background: #F0B429; }
      .fill-green { background: #2F9E6F; }
      .fill-red { background: #D9534F; }

      .dots { display: flex; gap: 12px; height: 14px; }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: #F0B429; will-change: transform; }
      .dot:nth-child(2) { opacity: 0.85; }
      .dot:nth-child(3) { opacity: 0.7; }
      .dot:nth-child(4) { opacity: 0.55; }

      .mono {
        font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 1.5cqw; font-weight: 600; line-height: 1; color: #F0B429;
      }
    </style>

    <div id="f04-explain-bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>

    <div class="clip" data-start="0" data-duration="6" data-track-index="1">
      <div id="f04-explain-window">
        <div id="f04-explain-zoom-outer">
          <div id="f04-explain-zoom-inner" data-layout-allow-overflow>
            <img id="f04-explain-shot" src="assets/it-shows-its-work.png" alt="" />
          </div>
        </div>
      </div>

      <div id="f04-explain-h2">Click a badge</div>

      <div id="f04-explain-burst">
        <div class="chip" data-target-y="-128">
          <div class="chip-title">probabilities</div>
          <div class="bars">
            <div class="track"><span class="fill fill-gold" data-pct="0.03"></span></div>
            <div class="track"><span class="fill fill-green" data-pct="0.11"></span></div>
            <div class="track"><span class="fill fill-red" data-pct="0.86"></span></div>
          </div>
        </div>
        <div class="chip" data-target-y="0">
          <div class="chip-title">signals that moved it</div>
          <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        </div>
        <div class="chip" data-target-y="128">
          <div class="chip-title">token cost</div>
          <div class="mono" id="f04-explain-tokens">in / out, per post</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["04-explain"] = tl;

        const $ = (s) => document.getElementById("f04-explain-" + s);
        const win = $("window"), outer = $("zoom-outer"), inner = $("zoom-inner"), h2 = $("h2");
        const chips = Array.from($("burst").querySelectorAll(".chip"));

        // Scene 1 (0.0–1.3): window enters, then one zoom-to-target locks on the open panel.
        tl.fromTo(win, { opacity: 0, y: 28, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0);

        // Panel measured in the raster: x 712–1029, y 102–657 of 1280×800 → at 0.9297 its centre sits
        // (+214, -19) from the 1190×744 window centre. Counter-translate is -offset, but x is clamped to
        // -119 so the image's right edge stays flush with the card at 1.25× (no bare card strip).
        const ZOOM = 1.25, ZOOM_AT = 0.35, ZOOM_DUR = 0.95;
        tl.to(outer, { scale: ZOOM, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);
        tl.to(inner, { x: -119, y: 19, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);

        tl.fromTo(h2, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);

        // Scene 2 (1.3–4.4): chips expand from the shared column centre, one per cue
        // (center-outward-expansion, short path: start at 35% of the target offset).
        const CUES = [1.4, 2.4, 3.4], START = 0.35, EXPAND = 0.7;
        chips.forEach((el, i) => {
          const ty = Number(el.dataset.targetY);
          tl.fromTo(el,
            { xPercent: -50, yPercent: -50, x: 0, y: ty * START, scale: 0.85, opacity: 0 },
            { x: 0, y: ty, scale: 1, opacity: 1, duration: EXPAND, ease: "power3.out" },
            CUES[i]);
        });

        // chip 1: three fills grow to the panel's own distribution (3 / 11 / 86 %)
        chips[0].querySelectorAll(".fill").forEach((f, i) => {
          tl.fromTo(f, { scaleX: 0 }, { scaleX: Number(f.dataset.pct), duration: 0.8, ease: "power2.out" }, CUES[0] + 0.3 + i * 0.08);
        });
        // chip 2: four signal dots pop in
        tl.fromTo(chips[1].querySelectorAll(".dot"), { scale: 0 },
          { scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, CUES[1] + 0.35);
        // chip 3: the mono figure lands
        tl.fromTo($("tokens"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, CUES[2] + 0.35);

        // Scene 3 (4.4–5.5): hold — nothing moves; pin the duration.
        tl.set({}, {}, 5.5);
      })();
    </script>
  </div>
</template>
