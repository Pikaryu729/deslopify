      [id="f03-demo-window"] {

      <div id="f03-demo-camera">
        <div id="f03-demo-h2">Every post gets a verdict</div>

          <div class="pill-03-demo" id="f03-demo-pill-1" style="--c:#F0B429"><i></i>golden nugget</div>

      <video
        id="f03-demo-capture"
        data-layout-allow-overflow
        src="assets/demo-capture.mp4"
        data-start="0"

        muted
        playsinline
      ></video>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["03-demo"] = tl;

        const $ = (s) => document.getElementById("f03-demo-" + s);
        const camera = $("camera"), win = $("window"), h2 = $("h2");
        const pills = [1, 2, 3].map((n) => $("pill-" + n));

        // window rises and settles; h2 fades in
        tl.fromTo(win, { y: 220, opacity: 0 }, { y: 0, opacity: 1, duration: 1.2, ease: "power3.out" }, 0);
        tl.fromTo(h2, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.5);

        // steady push on the copy column only, 1.00 → 1.03, then rest
        const cam = { scale: 1 };
        tl.to(cam, {
          scale: 1.03, duration: 10, ease: "sine.out",
          onUpdate: () => { camera.style.transform = `scale(${cam.scale})`; },
        }, 0);

        // legend pills wipe in while the real feed scrolls
        [2.0, 5.5, 9.0].forEach((at, i) => {
          tl.fromTo(pills[i],
            { clipPath: "inset(0px 100% 0px 0px round 100px)" },
            { clipPath: "inset(0px 0% 0px 0px round 100px)", duration: 0.5, ease: "power3.out" },
            at);
        });

        tl.set({}, {}, 14); // pin duration
      })();
    </script>
